[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pct"
version = "0.1.0"
description = "Project Curation Tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-frontmatter",
    "pydantic>=2.0",
    "lancedb",
    "sentence-transformers",
    "websockets",
    "aiofiles",
    "pyyaml",
    "loguru",
    "pydantic-settings",
    # Auth
    "pyjwt",
    "bcrypt",
    "google-auth",
    "llama-cpp-python",
    # Agent tools
    "ddgs",
    "httpx",
]

[project.optional-dependencies]
imagegen = [
    "diffusers>=0.27.0",
    "transformers",
    "accelerate",
    "torch>=2.0",
    "safetensors",
    "Pillow",
]
local-llm = [
    "huggingface-hub"
    ]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pct"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pct/**/router*.py" = ["B008"]   # Depends() in defaults is standard FastAPI
"src/pct/**/dependencies.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
